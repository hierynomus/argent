host: argent.example.com
corsOrigin: https://argent.example.com
auth:
  issuer: https://authentik.example.com/application/o/argent
  authority: https://authentik.example.com/application/o/argent/
  clientId: argent-client
  adminGroup: finance-admin
  importGroup: finance-import
imagePullSecrets:
  - name: registry
coingecko:
  apiKey: CG-demo-key
backend:
  image:
    repository: registry.example.com/argent-backend
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  autoscaling:
    enabled: true
  extraEnv:
    - name: TZ
      value: UTC
frontend:
  image:
    repository: registry.example.com/argent-frontend
    tag: 1.2.3
  topologySpreadConstraints: []
database:
  cnpg:
    instances: 3
    storage:
      size: 20Gi
      storageClass: longhorn
    backup:
      schedule: "0 0 2 * * *"
      barmanObjectStore:
        destinationPath: s3://backups/argent
        s3Credentials:
          accessKeyId: {name: s3, key: ACCESS_KEY_ID}
          secretAccessKey: {name: s3, key: SECRET_ACCESS_KEY}
networkPolicy:
  enabled: true
  egressHttpsTo:
    - ipBlock:
        cidr: 0.0.0.0/0
        except: [10.0.0.0/8]
