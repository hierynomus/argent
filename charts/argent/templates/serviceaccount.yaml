{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argent.serviceAccountName" . }}
  labels:
    {{- include "argent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# the pods never talk to the Kubernetes API
automountServiceAccountToken: false
{{- end }}
