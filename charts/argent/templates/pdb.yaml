{{- range $component := list "backend" "frontend" }}
{{- $c := index $.Values $component }}
{{- if and $c.podDisruptionBudget.enabled (gt (int $c.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "argent.fullname" $ }}-{{ $component }}
  labels:
    {{- include "argent.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  minAvailable: {{ $c.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "argent.componentSelectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
