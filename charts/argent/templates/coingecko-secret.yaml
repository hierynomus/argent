{{- if and .Values.coingecko.apiKey (not .Values.coingecko.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argent.coingeckoSecretName" . }}
  labels:
    {{- include "argent.labels" . | nindent 4 }}
type: Opaque
stringData:
  COINGECKO_API_KEY: {{ .Values.coingecko.apiKey | quote }}
{{- end }}
