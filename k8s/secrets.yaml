# Template — do NOT commit actual secrets.
# Create with: kubectl apply -f k8s/secrets.yaml
# Or use an external secrets manager (External Secrets Operator, Vault, etc.)
---
# Postgres credentials used by CloudNativePG bootstrap
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: argent
type: kubernetes.io/basic-auth
stringData:
  username: argent
  password: CHANGE_ME

---
# Backend runtime config
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: argent
type: Opaque
stringData:
  DATABASE_URL: "postgresql://argent:CHANGE_ME@argent-postgres-rw:5432/argent"
  AUTHENTIK_ISSUER: "https://authentik.example.com/application/o/argent"
  CORS_ORIGIN: "https://argent.example.com"
  # required in production: the Authentik groups that grant admin / import rights
  AUTHENTIK_ADMIN_GROUP: "argent-admin"
  AUTHENTIK_IMPORT_GROUP: "argent-import"
  # optional: a free CoinGecko "demo" API key (coingecko.com/en/api) — the key-less API is heavily rate limited
  # COINGECKO_API_KEY: ""

---
# Frontend runtime config (non-secret, but kept here for consistency)
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-env
  namespace: argent
data:
  VITE_AUTHENTIK_AUTHORITY: "https://authentik.example.com/application/o/argent"
  VITE_AUTHENTIK_CLIENT_ID: "CHANGE_ME"
