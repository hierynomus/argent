# Traefik IngressRoute (k3s/RKE2 default)
# Assumes cert-manager is installed for TLS + a ClusterIssuer named "letsencrypt"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argent-tls
  namespace: argent
spec:
  secretName: argent-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - argent.example.com

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argent
  namespace: argent
spec:
  entryPoints:
    - websecure
  tls:
    secretName: argent-tls
  routes:
    # API requests go to the backend
    - match: Host(`argent.example.com`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: backend
          port: 3000

    # Everything else goes to the SPA frontend
    - match: Host(`argent.example.com`)
      kind: Rule
      services:
        - name: frontend
          port: 80

---
# Redirect HTTP → HTTPS
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argent-http
  namespace: argent
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`argent.example.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: frontend
          port: 80

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: argent
spec:
  redirectScheme:
    scheme: https
    permanent: true
