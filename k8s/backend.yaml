apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: argent
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: your-registry/argent-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: backend-secrets
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      # Run migrations as an init container before the app starts
      initContainers:
        - name: migrate
          image: your-registry/argent-backend:latest
          command: ["bun", "run", "src/db/migrate.ts"]
          workingDir: /app/packages/backend
          envFrom:
            - secretRef:
                name: backend-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: argent
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
