# CloudNativePG operator must be installed on the cluster:
#   kubectl apply -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.25/releases/cnpg-1.25.0.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: argent-postgres
  namespace: argent
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  storage:
    size: 5Gi

  postgresql:
    parameters:
      max_connections: "100"

  bootstrap:
    initdb:
      database: argent
      owner: argent
      secret:
        name: postgres-credentials

  # Scheduled backups require a configured backup target (e.g. S3/MinIO)
  # Uncomment and configure if you want automated backups:
  # backup:
  #   barmanObjectStore:
  #     destinationPath: s3://your-bucket/cnpg
  #     s3Credentials:
  #       accessKeyId:
  #         name: s3-creds
  #         key: ACCESS_KEY_ID
  #       secretAccessKey:
  #         name: s3-creds
  #         key: SECRET_ACCESS_KEY
