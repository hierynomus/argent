name: Desktop installers

# Tauri builds installers only for the system it runs on, so each platform has its own runner:
#   ubuntu  → .deb .rpm .AppImage     macos → .dmg (arm64 on macos-latest, Intel on macos-15-intel)     windows → .msi .exe
# Called by ci.yml (build + keep as artifacts) and by release.yml (attach to a GitHub release).
on:
  workflow_call:
    inputs:
      platforms:
        description: JSON list of runner labels to build on
        type: string
        default: '["ubuntu-22.04","macos-latest","macos-15-intel","windows-latest"]'

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          key: ${{ matrix.os }}

      - name: System libraries for Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: AppImage runtime (Linux)
        # appimagetool downloads this itself and can hang on the connection; fetch it with a timeout instead
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/runtime" "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-$(uname -m)"
          echo "LDAI_RUNTIME_FILE=$RUNNER_TEMP/runtime" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/frontend build
      # the sidecar (the Argent server executable for this platform), then the Tauri bundle
      - run: bun run --cwd packages/desktop bundle
        env:
          # Apple silicon refuses unsigned code: sign ad hoc (no Apple account needed; Gatekeeper still warns on other Macs
          # until a real Developer ID certificate + notarization are configured)
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: argent-desktop-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            packages/desktop/src-tauri/target/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/release/bundle/msi/*.msi
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
