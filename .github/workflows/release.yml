name: Release

# Push a tag like v0.1.0: builds the installers on every platform and attaches them to a GitHub release.
on:
  push:
    tags: ["v*"]

jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml

  release:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: argent-desktop-*
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "Argent $GITHUB_REF_NAME" --generate-notes
